
<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haung专属温馨留言</title>
  <style>
    body {
      background-color: #ffe6f0;
      font-family: 'Noto Sans SC', sans-serif;
      color: #d63384;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .message-box {
      background: #fff0f5;
      border: 2px solid #ffc0cb;
      border-radius: 30px;
      padding: 30px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      max-width: 500px;
      font-size: 1.5rem;
      position: relative;
    }
    .anime-image {
      width: 150px;
      border-radius: 20px;
      margin-bottom: 20px;
    }
    .hearts {
      font-size: 2rem;
      margin-bottom: 10px;
    }
    footer {
      position: absolute;
      bottom: 10px;
      font-size: 0.9rem;
      color: #777;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC&display=swap" rel="stylesheet">
</head>
<body>
  <div class="message-box">
    <div class="hearts">❤️❤️❤️</div>
    <img src="https://i.pinimg.com/564x/e1/12/07/e11207e623d489256cc83b8f77de8e58.jpg" alt="cute anime" class="anime-image">
    <div id="message">你好美丽，Haung！</div>
  </div>
  <footer>© Danial Kurdi</footer>
  
  <audio id="chime" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_f8baaaeb72.mp3?filename=chinese-flute-1596.mp3"></audio>

  <script>
    const messages = [
      "你就像春天里的第一朵花，美得让人心醉。",
      "你的笑容是我一天中最温暖的阳光。",
      "Haung，你的存在让世界变得更美好了。",
      "你是我每天醒来的动力。",
      "你美得像一幅画，让我无法移开目光。",
      "你的声音像清风一样轻柔动人。",
      "Haung，你是我心中最美的诗。"
    ];

    const messageBox = document.getElementById('message');
    const chime = document.getElementById('chime');

    function updateMessage() {
      const msg = messages[Math.floor(Math.random() * messages.length)];
      messageBox.textContent = msg;
      chime.play();
    }

    setInterval(updateMessage, 20000);
  </script>
</body>
</html>
